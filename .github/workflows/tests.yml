name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.14', '3.15']
        include:
          # Python 3.8 没有 Ubuntu 26.04 构建，不随 ubuntu-latest 迁移。
          - os: ubuntu-22.04
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v test_pymoji
      - name: Validate example formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import pymoji
          for path in Path('examples').glob('*.pymoji'):
              pymoji.check_rectangle(path.read_text(encoding='utf-8'))
          PY
